name: Import and improve university matchmaker
on:
  push:
    branches: [main]
    paths: ['.github/workflows/bootstrap.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Import vetted source and build
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 --branch main 'https://github.com/ishaands12/match-maker-path.git' "$RUNNER_TEMP/upstream"
          test "$(git -C "$RUNNER_TEMP/upstream" rev-parse HEAD)" = "e7d81839cd118e0c0cf89dca54f1c260a6676422"
          rsync -a --exclude '.git' --exclude '.github' --exclude '.env' --exclude '.env.*' --exclude '*.local' "$RUNNER_TEMP/upstream/" ./
          test ! -e .env
          python - <<'PY'
          from pathlib import Path
          p=Path("src/components/Onboarding/OnboardingWizard.tsx")
          s=p.read_text()
          def replace_once(a,b):
              global s
              if s.count(a)!=1: raise RuntimeError("Expected exactly one occurrence: "+a[:80])
              s=s.replace(a,b)
          replace_once('  const [isSubmitting, setIsSubmitting] = useState(false);',
                       '  const [isSubmitting, setIsSubmitting] = useState(false);\n  const [shareWithCounselor, setShareWithCounselor] = useState(false);')
          replace_once('''      // Create a temporary user ID if not authenticated (as valid UUID v4)
                const generateUUID = () => {
                  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
                    const r = Math.random() * 16 | 0, v = c === 'x' ? r : (r & 0x3 | 0x8);
                    return v.toString(16);
                  });
                };
                const userId = session?.user?.id || generateUUID();''',
          '''      // Use an authenticated Supabase identity rather than forging an arbitrary user ID.
                // Enable Anonymous Sign-Ins in Supabase Auth for a guest onboarding flow.
                let userId = session?.user?.id;
                if (!userId) {
                  const { data: anonymousAuth, error: authError } = await supabase.auth.signInAnonymously();
                  if (authError || !anonymousAuth.user?.id) {
                    throw new Error("Guest onboarding requires anonymous Supabase Auth to be enabled.");
                  }
                  userId = anonymousAuth.user.id;
                }''')
          replace_once('''      triggerN8nWorkflow(userId, submissionData, data.personalInfo.email);''',
          '''      if (shareWithCounselor && import.meta.env.VITE_N8N_WEBHOOK_URL) {
                  void triggerN8nWorkflow(userId, submissionData, data.personalInfo.email);
                }''')
          replace_once("const n8nWebhookUrl = 'https://ishaandsai.app.n8n.cloud/webhook/student-profile-submitted';",
                       "const n8nWebhookUrl = import.meta.env.VITE_N8N_WEBHOOK_URL as string | undefined;\n      if (!n8nWebhookUrl) return;")
          replace_once('''            <div className="flex justify-between mt-8">
                        <Button''',
          '''            {currentStep === 4 && import.meta.env.VITE_N8N_WEBHOOK_URL && (
                        <label className="flex items-start gap-3 mt-6 rounded-lg border p-4 text-sm">
                          <input
                            type="checkbox"
                            className="mt-1"
                            checked={shareWithCounselor}
                            onChange={(event) => setShareWithCounselor(event.target.checked)}
                          />
                          <span>I agree to share my profile (including contact details) with the configured counselor automation. This is optional.</span>
                        </label>
                      )}
                      <div className="flex justify-between mt-8">
                        <Button''')
          p.write_text(s)
          p=Path(".gitignore");s=p.read_text();s+="\n# Never commit local credentials\n.env\n.env.*\n!.env.example\n";p.write_text(s)
          Path(".env.example").write_text("""# Frontend Supabase public/anonymous credentials (NOT service role)
          VITE_SUPABASE_URL=https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY=your_public_anon_or_publishable_key
          # Optional: requests are only sent when a user explicitly opts in on the Review screen.
          # A browser-exposed webhook URL is not a secret. Use an authenticated server proxy for production.
          # VITE_N8N_WEBHOOK_URL=https://your-n8n.example/webhook/student-profile
          """)
          Path("README.md").write_text("""# shaadi.com — University Matchmaker
          
          An independently maintained student-to-university matching and application-planning frontend, adapted from [ishaands12/match-maker-path](https://github.com/ishaands12/match-maker-path). The repository name is playful; this project is **not affiliated with any matrimonial platform**.
          
          ## What it offers
          - University discovery and profile-based matching.
          - Multi-step profile onboarding, college comparisons and task tracking.
          - React + TypeScript + Vite + Tailwind / shadcn UI.
          - Optional Supabase persistence and counselor notification workflow.
          
          ## Improvements in this edition
          - No committed \`.env\` file or private credentials; use the included \`.env.example\`.
          - Guest onboarding now requires a **real Supabase anonymous Auth session**, not a generated/forged user ID.
          - Counselor webhook is configurable and requires an explicit opt-in checkbox.
          - Clear startup and privacy warnings, CI builds, and project-specific setup notes.
          
          ## Run locally
          1. Install Node.js 20+.
          2. \`npm ci\`
          3. Copy \`.env.example\` to \`.env\` and set your own **public** Supabase URL and publishable key.
          4. In the Supabase project, enable Anonymous Sign-Ins if you want guest onboarding.
          5. \`npm run dev\` (Vite is configured on port 8080).
          6. \`npm run build\` for production asset compilation.
          
          ## Data, permissions and production risks
          - The university data is imported from the source project. **Do not treat the admissions statistics, tuition or rankings as verified/current**. Match percentages are heuristic, not admission probabilities.
          - Inspect and enable **Row Level Security (RLS)** on every Supabase table, restricting each user's profiles and related rows to their own authenticated \`auth.uid()\`. The frontend does not replace RLS.
          - Never store a Supabase service-role key in a Vite environment variable.
          - By default, counselor webhook sharing is **off**. Browser-exposed webhook URLs can be abused, so route notification requests via an authenticated backend before production.
          - The original backend workflow files under \`N8N_*\` / \`n8n_workflow*.json\` are reference materials and may require manual server-side configuration. The file \`src/api/workflow.ts\` is a helper, **not** a deployed Vite API route.
          - This source has not been tested with live student records, Supabase configuration or n8n. Do not collect real personal information until authentication, consent and data-protection controls have been verified.
          
          Original documentation remains available under \`N8N_*\` and \`DOCUMENTATION.md\`.
          """)
          p=Path("index.html")
          s=p.read_text()
          import re
          s=re.sub(r'<title>[^<]*</title>','<title>shaadi.com | University Matchmaker</title>',s)
          p.write_text(s)
          # Remove unverified third-party production endpoint literals from documentation and templates.
          for path in list(Path(".").glob("N8N*")) + list(Path(".").glob("n8n*")):
              if path.suffix not in {".md",".json",".sh"}: continue
              try: content=path.read_text()
              except UnicodeError: continue
              content=content.replace("https://ishaandsai.app.n8n.cloud", "https://your-n8n.example")
              path.write_text(content)
          
          PY
          npm ci --no-audit --no-fund
          npm run build
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then echo 'ERROR: .env tracked' && exit 1; fi
          git commit -m 'Import university matching app with privacy and onboarding improvements'
          git push origin HEAD:main
